spring:
  application:
    name: user-service
  profiles:
    default: dev
  datasource:
    # Shared Autonomous DB (same wallet and ADMIN login as the other services); this service owns the USERS schema.
    url: ${DB_URL:jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only maps onto it
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # qualify every entity table with the service schema instead of relying on the session's CURRENT_SCHEMA
        # (USER is a reserved word in Oracle, hence USERS)
        default_schema: USERS
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: USERS
    default-schema: USERS
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:production-fgivv4.eu.cluster.ntail.io:9092}
    # Cloud cluster login. Only the password is a secret: set KAFKA_PASSWORD in the environment, never in this file.
    # For a local plaintext broker set KAFKA_SECURITY_PROTOCOL=PLAINTEXT and KAFKA_BOOTSTRAP_SERVERS=localhost:9092.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:default}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: user-service
      # only mail for orders confirmed from now on, never replay history
      auto-offset-reset: latest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000

# Browser origins allowed to call the public API (comma separated), e.g. the order console and the supplier portal.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Redis is optional here (rate limits and the profile cache fail open), so its absence is not a health problem
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # oracle = refresh tokens in the USERS schema (no Redis needed); redis = keep them in Redis
  refresh-token-store: ${REFRESH_TOKEN_STORE:oracle}
  security:
    issuer: ${JWT_ISSUER:http://user-service}
    tenant-id: bazaar
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    bcrypt-strength: 12
    # PEM files for the RS256 key pair. When empty, a key pair is generated at startup
    # (fine for local dev; every restart then invalidates issued access tokens).
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    key-id: ${JWT_KEY_ID:user-service-key-1}
    # Shared secret for /api/v1/internal/** (stand-in for mTLS, see README).
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:change-me-internal-token}
    max-failed-logins: 5
    lockout-duration: 15m
  rate-limit:
    login-per-ip-per-minute: 5
    login-per-account-per-hour: 10
    password-reset-per-account-per-hour: 3
  tokens:
    email-verification-ttl: 24h
    password-reset-ttl: 30m
  idempotency:
    ttl: 24h
  events:
    # log  = print events to the log (no broker needed)
    # kafka = publish to Kafka topic below
    publisher: ${EVENTS_PUBLISHER:log}
    topic: domain.user.events
    # true = listen to domain.order.events and mail the customer when an order is confirmed (needs Kafka)
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:false}
    order-topic: domain.order.events
  mail:
    # log = print mails to the log; brevo = send through Brevo's HTTPS API (free tier, works on Render)
    provider: ${MAIL_PROVIDER:log}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:ShopTrail}
    brevo-api-key: ${BREVO_API_KEY:}
    # Public address of this service; mail links open <console-url>/console.html
    console-url: ${PUBLIC_BASE_URL:http://localhost:8081}
  outbox:
    poll-interval: 1000ms
    batch-size: 100
  dev:
    # Print raw verification / reset tokens to the log so flows can be tested without email.
    log-tokens: false

---
spring:
  config:
    activate:
      on-profile: dev
app:
  dev:
    log-tokens: true
